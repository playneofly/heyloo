<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <title>T</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050506'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' font-family='Georgia' fill='%23d4a84b'%3ET%3C/text%3E%3C/svg%3E" />
    <style>

      /* ===== پنل ورود flip-card — تم تیره (بدون لودر) ===== */
      :root { --lg-bg:#0d0f14; --lg-card:#1b1f28; --lg-card2:#151922; --lg-border:#333a48;
              --lg-input:#232936; --lg-text:#f2f3f5; --lg-sub:#9aa0a6; --lg-gold:#d4a84b; --lg-gold2:#e0b84d; }
      #loginOverlay {
        position: fixed; inset: 0; z-index: 99999;
        background: radial-gradient(1000px 700px at 50% -20%, #1a1e27 0%, var(--lg-bg) 60%, #07080b 100%);
        display: none; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box; overflow: auto;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, sans-serif;
      }
      .auth-box { display: flex; flex-direction: column; align-items: center; gap: 22px; margin: auto; padding: 20px 0; }
      .switch-row { display: flex; align-items: center; justify-content: center; gap: 18px; }
      .switch-row .side { font-size: 15px; font-weight: 600; color: var(--lg-sub); cursor: pointer; user-select: none; padding: 2px 4px; transition: color 0.2s; border-bottom: 2px solid transparent; }
      .switch-row .side.active { color: var(--lg-gold); border-bottom-color: var(--lg-gold); }
      .switch-row .slider { width: 56px; height: 26px; border-radius: 20px; background: var(--lg-input); border: 1.5px solid var(--lg-border); position: relative; cursor: pointer; transition: background 0.25s; flex-shrink: 0; }
      .switch-row .slider:before { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:var(--lg-gold); transition:transform 0.25s; }
      .switch-row .slider.on { background:rgba(212,168,75,0.25); border-color:var(--lg-gold); }
      .switch-row .slider.on:before { transform:translateX(30px); background:#fff; }
      .flip-wrap { perspective: 1200px; }
      .flip-card__inner { width: 320px; height: 460px; position: relative; transform-style: preserve-3d; transition: transform 0.7s; }
      .flip-card__inner.flipped { transform: rotateY(180deg); }
      .flip-card__front, .flip-card__back {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        -webkit-backface-visibility: hidden; backface-visibility: hidden;
        background: linear-gradient(165deg, var(--lg-card) 0%, var(--lg-card2) 100%);
        border: 1px solid var(--lg-border); border-radius: 14px;
        box-shadow: 0 24px 60px -16px rgba(0,0,0,0.8);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 26px 24px; box-sizing: border-box;
      }
      .flip-card__back { transform: rotateY(180deg); }
      .card-title { font-size: 24px; font-weight: 800; color: var(--lg-text); letter-spacing: 0.5px; margin-bottom: 6px; }
      .auth-form { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
      .auth-input { width: 100%; height: 44px; border-radius: 8px; border: 1.5px solid var(--lg-border); background: var(--lg-input); color: var(--lg-text); font-size: 14px; font-weight: 500; padding: 6px 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
      .auth-input::placeholder { color: var(--lg-sub); opacity: 0.85; }
      .auth-input:focus { border-color: var(--lg-gold); box-shadow: 0 0 0 3px rgba(212,168,75,0.16); }
      .auth-btn { width: 150px; height: 44px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--lg-gold2) 0%, #c89a35 100%); color: #1a1508; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; margin-top: 6px; transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s; box-shadow: 0 8px 20px -6px rgba(212,168,75,0.45); }
      .auth-btn:hover { transform: translateY(-1px); }
      .auth-btn:active { transform: translateY(1px); }
      .auth-btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .msg { display: none; font-size: 12px; text-align: center; font-weight: 600; padding: 7px 10px; border-radius: 6px; width: 100%; box-sizing: border-box; }
      .msg.error { color: #ffb4b4; background: rgba(255,80,80,0.12); border: 1px solid rgba(255,80,80,0.3); }
      .msg.ok { color: #b4f5b4; background: rgba(80,255,80,0.08); border: 1px solid rgba(80,255,80,0.25); }
      @media (max-width: 420px) { .flip-card__inner { width: 100%; max-width: 320px; height: 470px; } }
    </style>
    <script type="module" crossorigin src="/assets/index-uC5WU97B.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-0cA_JjOk.css">
  </head>
  <body style="margin:0;background:#050506">
    <!-- اپ کاملاً مخفی است تا لاگینِ قدیمیِ داخلش هرگز دیده نشود -->
    <div id="root" style="display:none"></div>


    <!-- پنل ورود/ثبت‌نام flip-card (بدون لودر) -->
    <div id="loginOverlay" dir="ltr">
      <div class="auth-box">
        <div class="switch-row">
          <span class="side active" id="sideLogin">Log in</span>
          <div class="slider" id="flipSlider"></div>
          <span class="side" id="sideSignup">Sign up</span>
        </div>
        <div class="flip-wrap">
          <div class="flip-card__inner" id="flipInner">
            <div class="flip-card__front">
              <div class="card-title">Log in</div>
              <div id="msgLogin" class="msg"></div>
              <form class="auth-form" id="loginForm" onsubmit="return false;">
                <input type="text" placeholder="Username" id="loginUsername" class="auth-input" autocomplete="username">
                <input type="password" placeholder="Password" id="loginPassword" class="auth-input" autocomplete="current-password">
                <button class="auth-btn" type="submit">Let`s go!</button>
              </form>
            </div>
            <div class="flip-card__back">
              <div class="card-title">Sign up</div>
              <div id="msgSignup" class="msg"></div>
              <form class="auth-form" id="signupForm" onsubmit="return false;">
                <input type="text" placeholder="Name" id="signupName" class="auth-input" autocomplete="name">
                <input type="text" placeholder="Username" id="signupUsername" class="auth-input" autocomplete="username">
                <input type="password" placeholder="Password" id="signupPassword" class="auth-input" autocomplete="new-password">
                <button class="auth-btn" type="submit">Confirm!</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ===== منطق نمایش =====
            var overlay = document.getElementById("loginOverlay");
      var root = document.getElementById("root");

      fetch("/api/me", { credentials: "include" })
        .then(function (r) {
          if (r.status === 200) {
            // لاگین هستی: اپ باز می‌شود (سریع، بدون لودر)
            root.style.display = "block";
          } else {
            // لاگین نیستی: پنل لاگین فوری
            overlay.style.display = "flex";
          }
        })
        .catch(function () {
          // خطا: اپ را باز کن
          root.style.display = "block";
        });

      // ===== منطق flip + ورود/ثبت‌نام =====
      var API = "/api";
      var flipped = false;
      var slider = document.getElementById("flipSlider");
      var inner = document.getElementById("flipInner");
      var sideLogin = document.getElementById("sideLogin");
      var sideSignup = document.getElementById("sideSignup");

      function setFlip(on) {
        flipped = on;
        inner.classList.toggle("flipped", on);
        slider.classList.toggle("on", on);
        sideLogin.classList.toggle("active", !on);
        sideSignup.classList.toggle("active", on);
      }
      slider.addEventListener("click", function(){ setFlip(!flipped); });
      sideLogin.addEventListener("click", function(){ setFlip(false); });
      sideSignup.addEventListener("click", function(){ setFlip(true); });

      function showMsg(el, text, type) {
        el.textContent = text;
        el.className = "msg " + type;
        el.style.display = "block";
        if (text) setTimeout(function(){ el.style.display = "none"; }, 5000);
      }
      function hideMsg(el){ el.style.display = "none"; }

      var loginMsg = document.getElementById("msgLogin");
      var signupMsg = document.getElementById("msgSignup");

      document.getElementById("loginForm").addEventListener("submit", function(e){
        e.preventDefault();
        var username = document.getElementById("loginUsername").value.trim();
        var password = document.getElementById("loginPassword").value;
        if (!username || !password) return showMsg(loginMsg, "Username and password are required", "error");
        var btn = this.querySelector("button"); btn.disabled = true; hideMsg(loginMsg);
        fetch(API + "/auth/login", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password })
        }).then(function(res){ return res.json().then(function(d){ return {ok: res.ok, d: d}; }); })
          .then(function(r){
            btn.disabled = false;
            if (r.ok && r.d.user) { window.location.href = "/"; }
            else { showMsg(loginMsg, (r.d && r.d.error) || "Login failed", "error"); }
          })
          .catch(function(){ btn.disabled = false; showMsg(loginMsg, "Connection error", "error"); });
      });

      document.getElementById("signupForm").addEventListener("submit", function(e){
        e.preventDefault();
        var name = document.getElementById("signupName").value.trim();
        var username = document.getElementById("signupUsername").value.trim();
        var password = document.getElementById("signupPassword").value;
        if (!name || !username || !password) return showMsg(signupMsg, "Name, username and password are required", "error");
        var btn = this.querySelector("button"); btn.disabled = true; hideMsg(signupMsg);
        fetch(API + "/auth/register", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password, displayName: name })
        }).then(function(res){ return res.json().then(function(d){ return {ok: res.ok, d: d}; }); })
          .then(function(r){
            btn.disabled = false;
            if (r.ok && r.d.user) { window.location.href = "/"; }
            else { showMsg(signupMsg, (r.d && r.d.error) || "Sign up failed", "error"); }
          })
          .catch(function(){ btn.disabled = false; showMsg(signupMsg, "Connection error", "error"); });
      });
    </script>
  </body>
</html>
