<html lang="fa" dir="rtl">

    <meta charset="UTF-8" />

    <!-- گیت ورود: کاربر لاگین‌نشده را به صفحه جدید /auth.html می‌فرستد -->
    <script>
      (function () {
        var STORAGE = "t_auth_gate";
        function reveal() {
          var r = document.getElementById("root");
          if (r) r.style.visibility = "visible";
        }
        // اگر همین الان توی همان جلسه درست شد، رد نشو (جلوگیری از حلقه)
        if (sessionStorage.getItem(STORAGE)) { reveal(); return; }
        fetch("/api/me", { credentials: "include" })
          .then(function (r) {
            if (r.status === 401) {
              sessionStorage.setItem(STORAGE, "1");
              window.location.replace("/login");
            } else {
              reveal();
            }
          })
          .catch(function () { reveal(); });
        // در صورت دیر شدن پاسخ، بعد از 4 ثانیه به هر حال اپ را نشان بده
        setTimeout(reveal, 4000);
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-uC5WU97B.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-0cA_JjOk.css">
  </head>
  <body style="margin:0;background:#050506">
    <div id="root" style="visibility:hidden"></div>
  </body>
</html>
